<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialHub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
  <nav class="navbar">
    <a href="index.html" class="brand">SocialHub</a>
    <div id="nav-links"></div>
  </nav>

  <main class="container">
    <!-- Shown when logged out -->
    <section id="auth-section" class="card hidden">
      <div class="tabs">
        <button id="show-login" class="tab active">Log in</button>
        <button id="show-register" class="tab">Sign up</button>
      </div>

      <form id="login-form">
        <input name="login" placeholder="Username or email" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Log in</button>
      </form>

      <form id="register-form" class="hidden">
        <input name="full_name" placeholder="Full name" maxlength="50" />
        <input name="username" placeholder="Username (3-20 chars)" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password (min 6 chars)" required />
        <button type="submit">Create account</button>
      </form>

      <p id="auth-error" class="error"></p>
    </section>

    <!-- Shown when logged in -->
    <section id="composer" class="card hidden">
      <form id="post-form">
        <textarea name="content" maxlength="280" placeholder="What's on your mind?" required></textarea>
        <div class="row">
          <small id="char-count" class="muted">0/280</small>
          <button type="submit">Post</button>
        </div>
      </form>
    </section>

    <h2 id="feed-title">Feed</h2>
    <section id="feed"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
